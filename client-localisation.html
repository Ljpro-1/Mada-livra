<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mada Livra - Localisation</title>


<style>

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

margin:0;
background:#f1f5f9;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}


.card{

background:white;
width:100%;
max-width:450px;
padding:30px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;

}


h1{

color:#007A3D;

}


.info{

background:#f8fafc;
padding:15px;
border-radius:15px;
margin:20px 0;
text-align:left;

}


.info p{

margin:10px 0;

}


button{

width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#007A3D;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:#005f2f;

}


.status{

margin-top:20px;
font-weight:bold;

}


</style>


</head>



<body>



<div class="card">


<h1>
📍 Mada Livra
</h1>


<p>
Veuillez enregistrer votre position pour la livraison.
</p>



<div class="info">


<p>
Client :
<b id="clientName">Chargement...</b>
</p>


<p>
Produit :
<b id="product">...</b>
</p>


</div>




<button id="locationBtn">

📍 Enregistrer ma localisation

</button>



<div class="status" id="status">

En attente...

</div>



</div>







<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

get,

update

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





// Firebase


const firebaseConfig = {


apiKey:"AIzaSyCQwioA_6Per63PcLIgrXUPr0S7_hA9ccM",

authDomain:"livraison-d29a1.firebaseapp.com",

databaseURL:"https://livraison-d29a1-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"livraison-d29a1",

storageBucket:"livraison-d29a1.firebasestorage.app",

messagingSenderId:"173715112364",

appId:"1:173715112364:web:05838c15e6a41acb6f7a09"


};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





// Récupération ID client depuis le lien


const params = new URLSearchParams(
window.location.search
);


const clientID = params.get("id");




const nameEl =
document.getElementById("clientName");


const productEl =
document.getElementById("product");


const btn =
document.getElementById("locationBtn");


const statusEl =
document.getElementById("status");



let clientRef = null;






// Charger les informations client


async function loadClient(){



if(!clientID){


statusEl.textContent =
"❌ Lien invalide";


btn.disabled=true;


return;


}



clientRef = ref(
db,
"clients/"+clientID
);



const snapshot = await get(clientRef);



if(!snapshot.exists()){


statusEl.textContent =
"❌ Client introuvable";


btn.disabled=true;


return;


}



const client = snapshot.val();



nameEl.textContent =
client.name || "-";


productEl.textContent =
client.product || "-";



}



loadClient();









// Enregistrer localisation


btn.onclick = ()=>{


if(!clientRef){


alert("Client non chargé");

return;


}




if(!navigator.geolocation){


statusEl.textContent =
"❌ GPS non disponible";


return;


}




statusEl.textContent =
"📍 Recherche GPS précise...";





navigator.geolocation.getCurrentPosition(



async(position)=>{


const latitude =
position.coords.latitude;


const longitude =
position.coords.longitude;



const accuracy =
position.coords.accuracy;




const locationLink =

"https://www.google.com/maps/dir/?api=1&destination="
+
latitude
+
","
+
longitude;





await update(clientRef,{


latitude:latitude,

longitude:longitude,

accuracy:accuracy,

locationLink:locationLink,

status:"located",

locatedAt:Date.now()


});





statusEl.innerHTML =

`
✅ Position enregistrée<br>
📍 Précision : ${Math.round(accuracy)} mètres
`;



btn.style.display="none";



},




(error)=>{


if(error.code===1){


statusEl.textContent =
"❌ Autorisation GPS refusée";


}

else if(error.code===2){


statusEl.textContent =
"❌ Position impossible";


}

else if(error.code===3){


statusEl.textContent =
"❌ Temps dépassé";


}

else{


statusEl.textContent =
"❌ Erreur GPS";


}


},




{


enableHighAccuracy:true,

timeout:15000,

maximumAge:0


}



);



};



</script>



</body>

</html>
